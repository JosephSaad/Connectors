# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THIS WORKFLOW DOES NOT RUN.                                             │
# │                                                                         │
# │ GitHub Actions only executes workflows from /.github/workflows at the   │
# │ REPOSITORY ROOT. This file sits under a connector directory, left from  │
# │ when each connector was its own repository, so no tag push has ever     │
# │ triggered it and no release has ever been produced by it.               │
# │                                                                         │
# │ It is kept because it is the only design the fleet has for release      │
# │ engineering — CycloneDX SBOM, self-contained single-file publish,       │
# │ Authenticode and cosign signing, GitHub release creation — none of      │
# │ which the root workflows do. Delete it only once that pipeline has      │
# │ been ported to the root, not before.                                    │
# │                                                                         │
# │ The sibling ci.yml and codeql.yml were removed in the commit that added │
# │ this banner; their work IS covered at the root.                         │
# └─────────────────────────────────────────────────────────────────────────┘

name: Release

# Two entry points:
#   - tag push (v*): full pipeline, ends by creating a GitHub release with the
#     bundles attached.
#   - workflow_dispatch: dry run — identical build/smoke/package path, bundles
#     upload as run artifacts only, and NO release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed by the release job to create the GitHub release on tag builds.
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Releases gate on the full suite — a tag on a red commit must not ship.
  test:
    name: Full test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test -c Release

  # ---------------------------------------------------------------------------
  # SBOM: CycloneDX bill of materials for the whole solution (supply-chain
  # inventory for procurement/vuln response). Attached to the GitHub release.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet restore
          dotnet-CycloneDX AltrataConnector.sln --json --output sbom \
            --filename altrata-connector.cdx.json --disable-github-licenses

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/altrata-connector.cdx.json
          if-no-files-found: error

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # win-x64 first-class: Windows Server + service mode is the primary
        # deployment target. linux-x64 covers containers/VMs.
        rid: [win-x64, linux-x64]
    env:
      # Signing material is OPTIONAL: forks and dry runs have no secrets and
      # every signing step below skips gracefully (with a log line) when its
      # secret is absent. Secrets land in job env so step `if:` can test them.
      AUTHENTICODE_PFX_B64: ${{ secrets.AUTHENTICODE_PFX_B64 }}
      AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/AltrataConnector -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Authenticode over the Windows exe (osslsigncode: signs PE files on the
      # linux runner). Skips with a notice when the cert secret is absent.
      - name: Authenticode sign (win-x64)
        if: ${{ matrix.rid == 'win-x64' && env.AUTHENTICODE_PFX_B64 != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q osslsigncode
          echo "$AUTHENTICODE_PFX_B64" | base64 -d > signing.pfx
          osslsigncode sign -pkcs12 signing.pfx -pass "$AUTHENTICODE_PFX_PASSWORD" \
            -n "Altrata Copilot Connector" -t http://timestamp.digicert.com \
            -in  publish/win-x64/AltrataConnector.exe \
            -out publish/win-x64/AltrataConnector.signed.exe
          mv publish/win-x64/AltrataConnector.signed.exe publish/win-x64/AltrataConnector.exe
          rm -f signing.pfx
          osslsigncode verify publish/win-x64/AltrataConnector.exe || true

      - name: Authenticode skipped (no signing secret)
        if: ${{ matrix.rid == 'win-x64' && env.AUTHENTICODE_PFX_B64 == '' }}
        run: echo "AUTHENTICODE_PFX_B64 not configured — shipping the exe unsigned (fork/dry-run path)."

      # Bundle layout mirrors a checkout: the app resolves config/ (and env/)
      # relative to its working directory, so the zip extracts to a directory
      # you run it from.
      - name: Assemble bundle
        id: bundle
        run: |
          NAME="AltrataConnector-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          ROOT="bundle/$NAME"
          mkdir -p "$ROOT/env" "$ROOT/scripts"
          find "publish/${{ matrix.rid }}" -maxdepth 1 -type f \
            ! -name "*.pdb" -exec cp {} "$ROOT/" \;
          cp -r config "$ROOT/config"
          cp env/.env.local.example "$ROOT/env/"
          cp env/README.md "$ROOT/env/"
          cp -r docs "$ROOT/docs"
          cp -r scripts/sql "$ROOT/scripts/sql"
          cp README.md LICENSE NOTICE "$ROOT/"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            cp scripts/install-windows-service.ps1 "$ROOT/scripts/"
          fi
          (cd bundle && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Cosign (keyed sign-blob) over the bundle zip: verifiable provenance for
      # air-gapped consumers (`cosign verify-blob`). Skips gracefully without
      # the key secret.
      - name: Cosign sign bundle
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign-blob
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          NAME="${{ steps.bundle.outputs.name }}"
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign-blob --yes --key cosign.key \
            --output-signature "bundle/$NAME.zip.sig" "bundle/$NAME.zip"
          rm -f cosign.key

      - name: Cosign skipped (no signing secret)
        if: ${{ env.COSIGN_PRIVATE_KEY == '' }}
        run: echo "COSIGN_PRIVATE_KEY not configured — bundle ships with SHA-256 checksum only."

      # Prove the artifact is actually runnable — a single-file self-contained
      # publish can build fine and still fail to bootstrap (missing native
      # libs). --help exercises startup + the CLI parser without credentials.
      - name: Smoke test published binary
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          cd "bundle/${{ steps.bundle.outputs.name }}"
          chmod +x AltrataConnector
          ./AltrataConnector --help

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: bundle/*.zip*
          if-no-files-found: error

  # Container distribution: the same image the docker CI job validates, pushed
  # to GHCR on tag builds. Dispatch dry runs build it end to end but never push.
  container:
    name: Container image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: img
        run: |
          # Registry paths must be lowercase; the repo owner is not.
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/altrata-connector" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (push on tag builds only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # MSI (EXPERIMENTAL): WiX v5 build of packaging/msi/Package.wxs on a Windows
  # runner. continue-on-error — the zip bundle + install script remain the
  # supported path; the MSI is published for SCCM/Intune pilots
  # (docs/DEPLOYMENT_ENTERPRISE.md). The .wxs structure itself is guarded by
  # offline unit tests (MsiPackagingTests) so drift is caught even while this
  # job is allowed to fail.
  # ---------------------------------------------------------------------------
  msi:
    name: MSI (windows, experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (win-x64 single file)
        run: >-
          dotnet publish src/AltrataConnector -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Build MSI (WiX v5)
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global wix --version "5.*"
          mkdir -p dist
          wix build packaging/msi/Package.wxs \
            -d PublishDir=publish/win-x64 -d RepoRoot=. \
            -arch x64 \
            -o "dist/AltrataConnector-${{ steps.ver.outputs.version }}.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [package, sbom]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist

      # The MSI is experimental (continue-on-error above): attach it when it
      # built, release without it when it did not.
      - name: Download MSI (optional)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: msi
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "AltrataConnector $GITHUB_REF_NAME"
          --generate-notes
