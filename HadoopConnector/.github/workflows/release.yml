# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THIS WORKFLOW DOES NOT RUN.                                             │
# │                                                                         │
# │ GitHub Actions only executes workflows from /.github/workflows at the   │
# │ REPOSITORY ROOT. This file sits under a connector directory, left from  │
# │ when each connector was its own repository, so no tag push has ever     │
# │ triggered it and no release has ever been produced by it.               │
# │                                                                         │
# │ It is kept because it is the only design the fleet has for release      │
# │ engineering — CycloneDX SBOM, self-contained single-file publish,       │
# │ Authenticode and cosign signing, GitHub release creation — none of      │
# │ which the root workflows do. Delete it only once that pipeline has      │
# │ been ported to the root, not before.                                    │
# │                                                                         │
# │ The sibling ci.yml and codeql.yml were removed in the commit that added │
# │ this banner; their work IS covered at the root.                         │
# └─────────────────────────────────────────────────────────────────────────┘

name: Release

# Two entry points:
#   - tag push (v*): full pipeline, ends by creating a GitHub release with the
#     bundles attached.
#   - workflow_dispatch: dry run — identical build/smoke/package path, bundles
#     upload as run artifacts only, and NO release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed by the release job to create the GitHub release on tag builds.
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Releases gate on the full suite — a tag on a red commit must not ship.
  test:
    name: Full test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test -c Release

  # ---------------------------------------------------------------------------
  # Software bill of materials (CycloneDX) — one SBOM covering the whole
  # solution's NuGet dependency graph, attached to the release for supply-chain
  # review / vulnerability correlation (SECURITY.md).
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX HadoopConnector.sln --json --output sbom \
            --filename hadoop-connector.cdx.json
          python3 -c "import json; json.load(open('sbom/hadoop-connector.cdx.json')); print('SBOM is valid JSON')"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom/hadoop-connector.cdx.json
          if-no-files-found: error

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # win-x64 first-class: Windows Server + service mode is the primary
        # deployment target. linux-x64 covers containers/VMs.
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Signing is OPT-IN by secrets so forks and secretless dry runs keep
      # working: each check step reports clearly when a signature is skipped.
      - name: Check signing secrets
        id: signing
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUTHENTICODE_PFX_BASE64" ]]; then
            echo "authenticode=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticode=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUTHENTICODE_PFX_BASE64 not configured — Authenticode signing skipped (unsigned exe)."
          fi
          if [[ -n "$COSIGN_PRIVATE_KEY" ]]; then
            echo "cosign=true" >> "$GITHUB_OUTPUT"
          else
            echo "cosign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COSIGN_PRIVATE_KEY not configured — cosign bundle signatures skipped."
          fi

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/HadoopConnector -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Authenticode (win-x64 exe) via osslsigncode, gated on secrets:
      #   AUTHENTICODE_PFX_BASE64  base64 of the code-signing PFX
      #   AUTHENTICODE_PFX_PASSWORD
      - name: Authenticode-sign HadoopConnector.exe
        if: ${{ matrix.rid == 'win-x64' && steps.signing.outputs.authenticode == 'true' }}
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osslsigncode
          umask 077
          echo "$AUTHENTICODE_PFX_BASE64" | base64 -d > signing.pfx
          osslsigncode sign \
            -pkcs12 signing.pfx -pass "$AUTHENTICODE_PFX_PASSWORD" \
            -n "BDH Hadoop Copilot Connector" \
            -t http://timestamp.digicert.com \
            -in  publish/win-x64/HadoopConnector.exe \
            -out publish/win-x64/HadoopConnector-signed.exe
          mv publish/win-x64/HadoopConnector-signed.exe publish/win-x64/HadoopConnector.exe
          rm -f signing.pfx
          osslsigncode verify publish/win-x64/HadoopConnector.exe || true

      # Bundle layout mirrors a checkout: the app resolves config/ (and env/)
      # relative to its working directory, so the zip extracts to a directory
      # you run it from.
      - name: Assemble bundle
        id: bundle
        run: |
          NAME="HadoopConnector-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          ROOT="bundle/$NAME"
          mkdir -p "$ROOT/env" "$ROOT/scripts"
          find "publish/${{ matrix.rid }}" -maxdepth 1 -type f \
            ! -name "*.pdb" -exec cp {} "$ROOT/" \;
          cp -r config "$ROOT/config"
          cp env/.env.local.example "$ROOT/env/"
          cp -r docs "$ROOT/docs"
          cp -r scripts/sql "$ROOT/scripts/sql"
          cp README.md LICENSE NOTICE "$ROOT/"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            cp scripts/install-windows-service.ps1 "$ROOT/scripts/"
          fi
          (cd bundle && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Detached cosign signature over the bundle zip, gated on secrets:
      #   COSIGN_PRIVATE_KEY  (cosign.key contents)  COSIGN_PASSWORD
      # Verify with: cosign verify-blob --key cosign.pub --signature X.zip.sig X.zip
      - name: Install cosign
        if: ${{ steps.signing.outputs.cosign == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Cosign-sign bundle
        if: ${{ steps.signing.outputs.cosign == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          ZIP="bundle/${{ steps.bundle.outputs.name }}.zip"
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --output-signature "$ZIP.sig" "$ZIP"

      # Prove the artifact is actually runnable — a single-file self-contained
      # publish can build fine and still fail to bootstrap (missing native
      # libs). --help exercises startup + the CLI parser without credentials.
      - name: Smoke test published binary
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          cd "bundle/${{ steps.bundle.outputs.name }}"
          chmod +x HadoopConnector
          ./HadoopConnector --help

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: bundle/*.zip*
          if-no-files-found: error

  # Container distribution: the same image the docker CI job validates, pushed
  # to GHCR on tag builds. Dispatch dry runs build it end to end but never push.
  container:
    name: Container image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: img
        run: |
          # Registry paths must be lowercase; the repo owner is not.
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/hadoop-connector" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (push on tag builds only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # EXPERIMENTAL MSI (WiX v5) for SCCM/Intune distribution — see
  # packaging/msi/HadoopConnector.wxs and docs/DEPLOYMENT_ENTERPRISE.md.
  # continue-on-error: a failed MSI must not block a release while the format
  # is experimental; the zip bundles remain the canonical artifacts.
  # ---------------------------------------------------------------------------
  msi:
    name: MSI package (win-x64, experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (win-x64 single file)
        run: >-
          dotnet publish src/HadoopConnector -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Build MSI (WiX v5)
        shell: bash
        run: |
          dotnet tool install --global wix --version "5.*"
          wix build packaging/msi/HadoopConnector.wxs \
            -d Version=${{ steps.ver.outputs.version }} \
            -d PublishDir=publish/win-x64 \
            -d RepoRoot=. \
            -arch x64 \
            -o "HadoopConnector-${{ steps.ver.outputs.version }}-win-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi-win-x64
          path: "*.msi"
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [package, sbom]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-cyclonedx
          path: dist

      # Best-effort: the experimental MSI is attached when its job produced
      # one, and its absence never blocks the release.
      - name: Download MSI (experimental, optional)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: msi-win-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "HadoopConnector $GITHUB_REF_NAME"
          --generate-notes
