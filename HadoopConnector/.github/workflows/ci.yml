name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Core build + unit tests (no external services; every HTTP call is mocked).
  # This is the gating job.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not a nicety: Windows Server is the primary
        # deployment target (Windows service mode), so the suite must pass
        # there, not only on the linux CI/dev machines.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >-
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results (trx)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload code coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Coverage gate. Measured on 2026-07-18 at 650 tests: 79.87% line coverage.
  # The gate is set to measured-minus-5 (74.87%) so ordinary drift never flakes
  # the build while a real coverage collapse (a big untested subsystem landing)
  # still fails. Raise the floor when the measured number moves up.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage gate (line >= 74.87%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test with coverage
        run: >-
          dotnet test -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Enforce line-coverage floor
        run: |
          set -euo pipefail
          REPORT="$(find TestResults -name 'coverage.cobertura.xml' | head -1)"
          if [[ -z "$REPORT" ]]; then
            echo "::error::No coverage.cobertura.xml produced."
            exit 1
          fi
          python3 - "$REPORT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          # Threshold policy: actual measured line coverage was 79.87% (650
          # tests, 2026-07-18); the enforced floor is actual - 5 = 74.87%.
          FLOOR = 74.87
          root = ET.parse(sys.argv[1]).getroot()
          line = float(root.get("line-rate")) * 100
          branch = float(root.get("branch-rate")) * 100
          print(f"line coverage   : {line:.2f}% (floor {FLOOR}%)")
          print(f"branch coverage : {branch:.2f}% (informational)")
          if line < FLOOR:
              print(f"::error::Line coverage {line:.2f}% fell below the {FLOOR}% floor.")
              sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # Performance smoke: the StressHarness filter-scale scenario drives the REAL
  # scanner/filter/fetcher at ~1.8M corpus rows. Thresholds are deliberately
  # GENEROUS versus measured numbers (~720k rows/s, ~94 MB peak RSS on a dev
  # laptop) so this job catches an order-of-magnitude regression — an
  # accidental per-row allocation or full-file materialization — not CI noise.
  # ---------------------------------------------------------------------------
  perf-smoke:
    name: Perf smoke (filter-scale >= 100k rows/s, RSS < 500 MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run filter-scale scenario
        run: >-
          dotnet run -c Release --project tools/StressHarness --
          --scenario filter-scale --scale 1
          | tee harness.out

      - name: Enforce generous thresholds
        run: |
          set -euo pipefail
          grep -q "1/1 scenarios passed" harness.out
          python3 - harness.out <<'PY'
          import re, sys
          out = open(sys.argv[1]).read()
          rows = float(re.search(r"throughput\s*:\s*([\d,]+) rows/s", out).group(1).replace(",", ""))
          rss = float(re.search(r"peak RSS ([\d,]+) MB", out).group(1).replace(",", ""))
          print(f"throughput = {rows:,.0f} rows/s (floor 100,000)")
          print(f"peak RSS   = {rss:,.0f} MB (ceiling 500)")
          if rows < 100_000:
              print(f"::error::filter-scale throughput {rows:,.0f} rows/s below the 100k floor.")
              sys.exit(1)
          if rss >= 500:
              print(f"::error::filter-scale peak RSS {rss:,.0f} MB breached the 500 MB ceiling.")
              sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # Provision the SQL schema against a real SQL Server 2022 — twice, proving
  # the documented idempotent re-run/upgrade path against a live engine (the
  # static ScriptDom/DacFx suite covers grammar + binding offline).
  # ---------------------------------------------------------------------------
  sql-provisioning:
    name: SQL Schema Provisioning (idempotent re-run)
    runs-on: ubuntu-latest
    env:
      # Workflow-local throwaway SA password; only exists for this job's
      # service container. No repo secret needed.
      SA_PASSWORD: "Your_strong!Passw0rd1"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_strong!Passw0rd1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for SQL Server to accept connections
        run: |
          echo "Waiting for SQL Server on 127.0.0.1:1433 ..."
          for i in $(seq 1 40); do
            if docker run --rm --network host \
                 mcr.microsoft.com/mssql-tools:latest \
                 /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up (attempt $i)."
              exit 0
            fi
            echo "  not ready yet (attempt $i/40); sleeping 5s"
            sleep 5
          done
          echo "::error::SQL Server did not become ready in time."
          exit 1

      - name: Provision database schema (twice)
        run: |
          for pass in 1 2; do
            echo "Running scripts/sql/create-database.sql via sqlcmd (pass $pass) ..."
            docker run --rm --network host \
              -v "${{ github.workspace }}/scripts/sql:/scripts:ro" \
              mcr.microsoft.com/mssql-tools:latest \
              /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -b -i /scripts/create-database.sql
          done

  # ---------------------------------------------------------------------------
  # Build the container image (no push) to validate the Dockerfile builds end
  # to end. Load into the local daemon so a runtime-stage failure is caught too.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hadoop-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
