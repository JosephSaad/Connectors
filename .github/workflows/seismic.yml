name: Seismic

# Build and test the Seismic connector, which consumes the shared
# Connector.Chassis project.
#
# Path-filtered on the connector AND the chassis: a chassis change can break a
# consumer, so it must re-run this suite.
#
# NOTE: workflows only execute from `.github/workflows` at the repository root.
# Every workflow lives there; the connectors carry none of their own. Releases
# for this connector are release-seismic.yml.

on:
  push:
    branches: [main]
    paths:
      - "SeismicConnector/**"
      - "Connector.Chassis/**"
      - ".github/workflows/seismic.yml"
  # Deliberately NOT filtered by base branch: the connectors are migrated onto
  # the chassis as a stack of dependent PRs, and a base-branch filter would skip
  # checks on every PR that targets another PR's branch rather than main.
  pull_request:
    paths:
      - "SeismicConnector/**"
      - "Connector.Chassis/**"
      - ".github/workflows/seismic.yml"
  workflow_dispatch:

concurrency:
  group: seismic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  TEST_PROJECT: "SeismicConnector/tests/SeismicConnector.Tests/SeismicConnector.Tests.csproj"

jobs:
  # ---------------------------------------------------------------------------
  # Build + unit/integration tests (no external services). SQL/HA and other
  # network-gated tests self-skip because their *_TEST_* env vars are unset, so
  # this job stays hermetic. windows-latest is not a nicety: Windows Server is
  # the primary deployment target (Windows service mode).
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes ~10 min on Linux but 50+ min on the Windows runner. Bound
    # it so a stuck run cannot occupy a runner for the 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build

  # ---------------------------------------------------------------------------
  # Build the container image. This exists because the connector now references
  # the chassis project, so the image can only build with the REPOSITORY ROOT as
  # its context (a Docker build cannot reach outside its context). Building here
  # keeps that wiring honest — the image is built, not pushed.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (context = repository root)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: SeismicConnector/Dockerfile
          push: false
          tags: seismic-connector:ci
