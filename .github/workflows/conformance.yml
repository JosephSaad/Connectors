# Chassis conformance
# -------------------
# Fails when a capability the fleet claims is uniform is missing from a
# connector, AND when a connector carries its own copy of a chassis type without
# declaring it.
#
# The TOGAF assessment named the first as a distinct concern from the copied
# chassis itself: "observable chassis drift — Salesforce lacks OpenTelemetry
# tracing the others (and the docs) claim is standard". Drift of that kind is
# invisible in the per-connector suites, because each one only tests what it has.
#
# The second half is new, and it is the half that matters. The original gate was
# `grep -rqE` over *.cs and *.csproj with no compilation, no XML parsing and no
# negative assertion. Two consequences, both demonstrated rather than assumed:
#
#   * a .cs file containing ONLY COMMENTS satisfied all six checks, including the
#     "Connector.Chassis project reference" one — so a connector could drop its
#     reference, leave a commented-out line behind, and stay green;
#   * with nothing asserting ABSENCE, the gate was green while 70 local copies of
#     chassis types sat in four connectors. It was green precisely while the
#     condition it exists to police was being violated.
#
# The logic now lives in .github/conformance/conformance.py so it can be tested,
# and the run below tests it BEFORE trusting it: --self-test asserts the gate
# still rejects the comments-only file, the commented-out ProjectReference and
# the unresolvable one. A gate nobody can test is the thing being replaced here,
# so shipping a new one without a test would repeat the mistake in a nicer
# language.
#
# Accepted divergences live in .github/conformance/divergences.tsv. It is a
# ratchet, not an amnesty: an undeclared copy fails, and so does a register line
# whose copy no longer exists, so the register cannot outlive the debt.
#
# The same job also gates TENANT_GOVERNANCE.md, the fleet's shared-quota plan.
# Both are the same species of problem -- a coordination artifact that nothing
# verifies -- and both now fail the build rather than drift.

name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chassis-conformance:
    name: Chassis conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs first and on its own: if the checker cannot prove it has teeth,
      # a passing conformance result below would mean nothing.
      - name: Self-test the gate
        run: python3 .github/conformance/conformance.py --self-test

      - name: Every connector carries every declared chassis capability
        run: python3 .github/conformance/conformance.py --annotate

      # TOGAF concern 5, second half. TENANT_GOVERNANCE.md allocates one
      # tenant's Graph quota across five connectors that deploy independently,
      # and says so itself: "nothing in code coordinates them -- this document
      # is that coordination." Nothing checked it either; a grep of .github/
      # for TENANT_GOVERNANCE or shard budgets returned nothing. Now the plan's
      # arithmetic, its own published limits, its coverage of every connector
      # in the repo, and the shard counts the repo SHIPS to operators are all
      # asserted on every PR.
      - name: Self-test the tenant capacity gate
        run: python3 .github/conformance/tenant_capacity.py --self-test

      - name: The tenant capacity plan holds
        run: python3 .github/conformance/tenant_capacity.py --annotate
