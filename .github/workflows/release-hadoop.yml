name: Release Hadoop (BDH)

# Thin caller for the shared release pipeline in release-connector.yml.
#
# Tags are per-connector (hadoop-v1.2.0), not fleet-wide: the five connectors
# version and ship independently (TENANT_GOVERNANCE.md), and a shared "v*"
# tag would fire all five pipelines against one tag, where the first to
# finish creates the release and the other four fail on it already existing.

on:
  push:
    tags: ["hadoop-v*"]
  # Dry run: builds, smoke-tests and packages everything, pushes nothing
  # and creates no release.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-hadoop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-connector.yml
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the image to GHCR
    secrets: inherit    # signing material is optional; see release-connector.yml
    with:
      connector: HadoopConnector
      solution: HadoopConnector.sln
      project: src/HadoopConnector
      test_project: tests/HadoopConnector.Tests/HadoopConnector.Tests.csproj
      binary: HadoopConnector
      product_name: "BDH Hadoop Copilot Connector"
      image_name: hadoop-connector
      tag_prefix: hadoop-v
      sbom_file: hadoop-connector.cdx.json
      wxs: packaging/msi/HadoopConnector.wxs
      msi_root_var: RepoRoot
      msi_version_var: Version
