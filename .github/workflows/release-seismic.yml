name: Release Seismic

# Thin caller for the shared release pipeline in release-connector.yml.
#
# Tags are per-connector (seismic-v1.2.0), not fleet-wide: the five connectors
# version and ship independently (TENANT_GOVERNANCE.md), and a shared "v*"
# tag would fire all five pipelines against one tag, where the first to
# finish creates the release and the other four fail on it already existing.

on:
  push:
    tags: ["seismic-v*"]
  # Dry run: builds, smoke-tests and packages everything, pushes nothing
  # and creates no release.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-seismic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-connector.yml
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the image to GHCR
    secrets: inherit    # signing material is optional; see release-connector.yml
    with:
      connector: SeismicConnector
      solution: SeismicConnector.sln
      project: src/SeismicConnector
      test_project: tests/SeismicConnector.Tests/SeismicConnector.Tests.csproj
      binary: SeismicConnector
      product_name: "Seismic Copilot Connector"
      image_name: seismic-connector
      tag_prefix: seismic-v
      sbom_file: seismic-connector.cdx.json
      wxs: packaging/msi/SeismicConnector.wxs
      msi_root_var: RepoRoot
      msi_version_var: ProductVersion
