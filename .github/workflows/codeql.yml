name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays 06:17 UTC (offset off the hour to avoid the scheduler rush).
    - cron: "17 6 * * 1"

# Cancel superseded runs on the same ref.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      # Needed by the workflow to read the repo (and Actions metadata).
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Add the security-and-quality suite for a broader ruleset (covers the
          # secret/dependency-adjacent code-scanning story alongside Dependabot).
          queries: security-and-quality

      # C# is a compiled language, so CodeQL needs a build. An explicit Release
      # build (rather than autobuild) is deterministic and matches CI.
      - name: Build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
