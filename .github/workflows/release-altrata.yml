name: Release Altrata

# Thin caller for the shared release pipeline in release-connector.yml.
#
# Tags are per-connector (altrata-v1.2.0), not fleet-wide: the five connectors
# version and ship independently (TENANT_GOVERNANCE.md), and a shared "v*"
# tag would fire all five pipelines against one tag, where the first to
# finish creates the release and the other four fail on it already existing.

on:
  push:
    tags: ["altrata-v*"]
  # Dry run: builds, smoke-tests and packages everything, pushes nothing
  # and creates no release.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-altrata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-connector.yml
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push the image to GHCR
    secrets: inherit    # signing material is optional; see release-connector.yml
    with:
      connector: AltrataConnector
      solution: AltrataConnector.sln
      project: src/AltrataConnector
      test_project: tests/AltrataConnector.Tests/AltrataConnector.Tests.csproj
      binary: AltrataConnector
      product_name: "Altrata Copilot Connector"
      image_name: altrata-connector
      tag_prefix: altrata-v
      sbom_file: altrata-connector.cdx.json
      wxs: packaging/msi/Package.wxs
      msi_root_var: RepoRoot
