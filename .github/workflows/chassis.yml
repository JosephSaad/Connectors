name: Chassis

# Build, verify and pack the shared Connector.Chassis package.
#
# Path-filtered: this only runs when the chassis (or this workflow) changes, so
# doc-only and connector-only commits don't pay for it.
#
# NOTE: GitHub Actions only executes workflows found in `.github/workflows` at
# the *repository root*. Every workflow in this repository lives there; the
# connectors carry none of their own. This was the first workflow here that
# actually ran.

on:
  push:
    branches: [main]
    paths:
      - "Connector.Chassis/**"
      - "Connector.Chassis.Tests/**"
      - ".github/workflows/chassis.yml"
  pull_request:
    branches: [main]
    paths:
      - "Connector.Chassis/**"
      - "Connector.Chassis.Tests/**"
      - ".github/workflows/chassis.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: chassis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CHASSIS_PROJECT: "Connector.Chassis/Connector.Chassis.csproj"
  CHASSIS_SOLUTION: "Connector.Chassis/Chassis.sln"
  CHASSIS_TESTS: "Connector.Chassis.Tests/Connector.Chassis.Tests.csproj"

jobs:
  # ---------------------------------------------------------------------------
  # Build on both targets. windows-latest is not a nicety: Windows Server is the
  # primary deployment target (Windows service mode), and the chassis carries the
  # Windows-specific surface (EventLog, Hosting.WindowsServices), so it must
  # compile there and not only on the Linux CI/dev machines.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.CHASSIS_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.CHASSIS_SOLUTION }} -c Release --no-restore

      # The chassis is the single point of failure for all five connectors and
      # until now nothing tested it directly: this job was restore + build +
      # pack, and chassis coverage was whatever the connector suites happened to
      # reach on the way past. On windows-latest especially -- the chassis owns
      # the Event Log sink, the Windows service host and every FileShare mode in
      # the fleet, and Windows is the only runner that ENFORCES share modes.
      - name: Test
        run: dotnet test ${{ env.CHASSIS_TESTS }} -c Release --no-build

  # ---------------------------------------------------------------------------
  # Pack once (the package is platform-neutral) and publish the .nupkg as a build
  # artifact.
  #
  # NOTE ON WHY THIS EXISTS. The comment here used to say "Connectors consume the
  # chassis by PackageReference, so this artifact is what makes a consolidated
  # connector buildable off a clean clone". That is false and has been for some
  # time: all five consume it by ProjectReference, which conformance.yml now
  # asserts by resolving the reference through the csproj XML to a file on disk.
  # Nothing consumes this .nupkg. It is kept because packing is the only check
  # that the chassis remains packable -- IsPackable is true and the version is
  # maintained -- and that is worth one 30-second job, but it is a build check,
  # not a distribution channel.
  # ---------------------------------------------------------------------------
  pack:
    name: Pack
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack
        run: dotnet pack ${{ env.CHASSIS_PROJECT }} -c Release -o artifacts

      - name: Report package version
        run: ls -l artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: connector-chassis-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
