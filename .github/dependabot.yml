version: 2

updates:
  # ---- NuGet: connector -----------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/src/SalesforceCopilotConnector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- NuGet: test project --------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/tests/SalesforceCopilotConnector.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- NuGet: stress-harness tool -------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/tools/StressHarness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- GitHub Actions -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ---- Docker (base images in the Dockerfile) -------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      # The app targets net8.0: a 10.x runtime base image cannot run the
      # framework-dependent publish (the docker CI job only BUILDS the image,
      # so its green check would not catch that), and the SDK image stays in
      # lockstep with the runtime. Remove both entries when the project
      # deliberately migrates TargetFramework to net10.0.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
