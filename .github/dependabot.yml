# Dependabot configuration — REPOSITORY ROOT
# ------------------------------------------
# GitHub reads this file only at .github/dependabot.yml in the repository root.
# A stale copy under SalesforceConnector/.github/ — where the monorepo
# consolidation had left it, unread, so nothing was scanned on any of the five
# connectors — has since been deleted. This file is the only Dependabot config
# in the repository and covers the whole tree.
#
# Directory paths below are repository-root-relative and must stay in step with
# the project layout: 13 project files, five Dockerfiles, one live workflows
# directory. A path that no longer resolves is silently skipped, which is the
# failure mode this file exists to correct — so when a project moves, move its
# entry with it.

version: 2

updates:
  # ---- NuGet: every project in the monorepo ---------------------------------
  # One entry covering all 13 projects rather than one entry each, so a package
  # shared across connectors moves in a SINGLE pull request. Version alignment
  # across the fleet matters now that all five build against one chassis; split
  # entries would drift them apart one PR at a time.
  - package-ecosystem: "nuget"
    directories:
      - "/Connector.Chassis"
      - "/AltrataConnector/src/AltrataConnector"
      - "/AltrataConnector/tests/AltrataConnector.Tests"
      - "/ClarizenConnector/src/ClarizenConnector"
      - "/ClarizenConnector/tests/ClarizenConnector.Tests"
      - "/HadoopConnector/src/HadoopConnector"
      - "/HadoopConnector/tests/HadoopConnector.Tests"
      - "/HadoopConnector/tools/StressHarness"
      - "/SalesforceConnector/src/SalesforceCopilotConnector"
      - "/SalesforceConnector/tests/SalesforceCopilotConnector.Tests"
      - "/SalesforceConnector/tools/StressHarness"
      - "/SeismicConnector/src/SeismicConnector"
      - "/SeismicConnector/tests/SeismicConnector.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"
    groups:
      # Minor and patch bumps arrive as one reviewable PR. Majors are
      # deliberately left ungrouped so each gets its own PR and its own CI run.
      dotnet:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---- Docker: the connector base images ------------------------------------
  # Each connector's Dockerfile pins mcr.microsoft.com/dotnet/{sdk,runtime}:10.0.
  # These carry OS-level CVE fixes, so they are the security-relevant half of
  # this file even though they change less often than packages.
  - package-ecosystem: "docker"
    directories:
      - "/AltrataConnector"
      - "/ClarizenConnector"
      - "/HadoopConnector"
      - "/SalesforceConnector"
      - "/SeismicConnector"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    groups:
      docker-base-images:
        patterns:
          - "*"

  # ---- GitHub Actions -------------------------------------------------------
  # Only /.github/workflows executes, and it is now the only workflow directory
  # in the repository — the inert per-connector copies that used to sit under
  # <Connector>/.github/workflows/ have been deleted. Bumping an action in a
  # workflow that never ran is what made three earlier Dependabot PRs
  # unmergeable; there is nothing left here to produce that.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
