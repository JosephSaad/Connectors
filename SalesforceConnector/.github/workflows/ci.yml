name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Core build + unit/integration tests (no external services). SQL/HA and other
  # network-gated tests self-skip here because their *_TEST_* env vars are unset,
  # so this job stays hermetic and fast. This is the gating job.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not a nicety: Windows Server is the primary
        # deployment target (Windows service mode), so the suite must pass
        # there, not only on the linux CI/dev machines.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >-
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results (trx)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload code coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # SQL Server integration: spin up SQL Server 2022, provision the schema, then
  # run the suite AGAIN with SQLSERVER_TEST_CONNECTION_STRING set so the
  # self-skipping SQL/HA integration tests actually execute.
  #
  # This is a SEPARATE job on purpose: if SQL Server fails to come up (or the
  # schema step fails), only this job goes red — the gating build-test job is
  # unaffected.
  # ---------------------------------------------------------------------------
  sql-integration:
    name: SQL Server Integration Tests
    runs-on: ubuntu-latest
    env:
      # Workflow-local throwaway SA password. NOT a real secret — it only exists
      # for the lifetime of this job's service container. No repo secret needed.
      SA_PASSWORD: "Your_strong!Passw0rd1"
      SQL_DB_NAME: "SalesforceConnector"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_strong!Passw0rd1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        # A container-level healthcheck can't easily read the runner env, so we
        # poll from a dedicated step below instead.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Wait for SQL Server to accept connections
        run: |
          echo "Waiting for SQL Server on 127.0.0.1:1433 ..."
          for i in $(seq 1 40); do
            if docker run --rm --network host \
                 mcr.microsoft.com/mssql-tools:latest \
                 /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up (attempt $i)."
              exit 0
            fi
            echo "  not ready yet (attempt $i/40); sleeping 5s"
            sleep 5
          done
          echo "::error::SQL Server did not become ready in time."
          exit 1

      - name: Provision database schema (twice)
        # Two passes on purpose: the second run proves the documented
        # idempotent re-run/upgrade path against a live engine, not just
        # by static lint.
        run: |
          for pass in 1 2; do
            echo "Running scripts/sql/create-database.sql via sqlcmd (pass $pass) ..."
            docker run --rm --network host \
              -v "${{ github.workspace }}/scripts/sql:/scripts:ro" \
              mcr.microsoft.com/mssql-tools:latest \
              /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -b -i /scripts/create-database.sql
          done

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (SQL/HA integration enabled)
        env:
          # Presence of this var flips the SQL/HA integration tests from skipped
          # to executed (see SqlServerIdentityStoreTests / SqlStateStoreTests /
          # HaCoordinatorTests).
          SQLSERVER_TEST_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=SalesforceConnector;User Id=sa;Password=Your_strong!Passw0rd1;TrustServerCertificate=true;Encrypt=true"
        run: >-
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=sql-integration-results.trx"
          --results-directory ./TestResults

      - name: Upload SQL integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sql-integration-trx
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Code-coverage gate. Line coverage measured 52.9% (8671/16384 lines) when
  # this gate was introduced (hermetic suite — SQL/HA integration tests
  # self-skip here, same as the build-test job); the threshold is set 5 points
  # below that at 47.9% so ordinary churn never blocks a PR but a coverage
  # collapse does. Raise the threshold when coverage moves up; never lower it
  # to make a PR pass.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage Gate (line >= 47.9%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test with coverage collector
        run: >-
          dotnet test -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Enforce line-coverage threshold
        run: |
          FILE=$(find ./TestResults -name 'coverage.cobertura.xml' | head -1)
          if [[ -z "$FILE" ]]; then
            echo "::error::No coverage.cobertura.xml produced."
            exit 1
          fi
          python3 - "$FILE" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          threshold = 47.9   # measured 52.9% line coverage at gate introduction
          root = ET.parse(sys.argv[1]).getroot()
          rate = float(root.get("line-rate")) * 100
          covered, valid = root.get("lines-covered"), root.get("lines-valid")
          print(f"Line coverage: {rate:.2f}% ({covered}/{valid} lines); gate: >= {threshold}%")
          if rate < threshold:
              print(f"::error::Line coverage {rate:.2f}% is below the {threshold}% gate.")
              sys.exit(1)
          EOF

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-report
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Perf smoke: one 20k-item throughput run of the stress harness with GENEROUS
  # floors (real hardware does >20k items/s; CI runners are slow and shared, so
  # the gate is >=3,000 items/s and <500 MB peak RSS). This catches order-of-
  # magnitude regressions (accidental serialization, per-item allocations)
  # without flaking on runner noise. Invariants are still enforced by the
  # harness itself (non-zero exit).
  # ---------------------------------------------------------------------------
  perf-smoke:
    name: Perf Smoke (>=3k items/s, <500MB RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run throughput scenario (20k items)
        run: >-
          dotnet run --project tools/StressHarness -c Release --
          --scenario throughput --items 20000
          --summary-json perf-summary.json

      - name: Enforce perf floors
        run: |
          jq . perf-summary.json
          ITEMS_PER_SEC=$(jq -r '.[] | select(.name=="throughput") | .itemsPerSec' perf-summary.json)
          PEAK_RSS_MB=$(jq -r '.[] | select(.name=="throughput") | .peakRssMb' perf-summary.json)
          echo "throughput: ${ITEMS_PER_SEC} items/s (floor 3000); peak RSS: ${PEAK_RSS_MB} MB (ceiling 500)"
          FAIL=0
          awk -v v="$ITEMS_PER_SEC" 'BEGIN { exit !(v >= 3000) }' \
            || { echo "::error::Throughput ${ITEMS_PER_SEC} items/s is below the 3,000 items/s floor."; FAIL=1; }
          awk -v v="$PEAK_RSS_MB" 'BEGIN { exit !(v < 500) }' \
            || { echo "::error::Peak RSS ${PEAK_RSS_MB} MB exceeds the 500 MB ceiling."; FAIL=1; }
          exit $FAIL

      - name: Upload perf summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-summary
          path: perf-summary.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stress harness: 4 concurrency scenarios (throughput / throttle / failures /
  # stop-resume) against the file+SQLite backend with fake APIs, gated on its
  # 44 correctness invariants — NOT on throughput numbers, which vary by
  # runner. This is the tool that caught the dead-letter interleaving bug; it
  # exits non-zero if any invariant fails.
  # ---------------------------------------------------------------------------
  stress:
    name: Stress Harness (invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run stress scenarios
        run: dotnet run --project tools/StressHarness -c Release

      - name: Upload harness workdir (failure diagnosis)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-workdir
          path: stress-out/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Build the container image (no push) to validate the Dockerfile builds end to
  # end. Uses Buildx with layer caching; load into the local daemon so a failure
  # in the runtime stage is caught too.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: salesforce-copilot-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
