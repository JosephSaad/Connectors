name: Release

# Two entry points:
#   - tag push (v*): full pipeline, ends by creating a GitHub release with the
#     bundles attached.
#   - workflow_dispatch: dry run — identical build/smoke/package path, bundles
#     upload as run artifacts only, and NO release is created. Use this to
#     validate the pipeline without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed by the release job to create the GitHub release on tag builds.
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Releases gate on the full suite — a tag on a red commit must not ship.
  test:
    name: Full test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test -c Release

  # ---------------------------------------------------------------------------
  # SBOM: CycloneDX bill of materials for the whole solution, attached to the
  # release so consumers can scan the dependency tree without building.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM (JSON)
        run: dotnet CycloneDX SalesforceCopilotConnector.sln -o sbom -fn sbom.cdx.json -j

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/sbom.cdx.json
          if-no-files-found: error

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # win-x64 first-class: Windows Server + service mode is the primary
        # deployment target. linux-x64 covers containers/VMs.
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/SalesforceCopilotConnector -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Authenticode signing — GATED on the signing secrets existing. Without
      # them the steps are skipped with a notice and the release still ships
      # (unsigned), so forks and dry runs never fail here. osslsigncode signs
      # PE files on the linux runner; timestamped so signatures outlive the
      # cert. Secrets: SIGNING_CERT_PFX_BASE64 (base64 PFX), SIGNING_CERT_PASSWORD.
      - name: Authenticode sign win-x64 binary
        if: ${{ matrix.rid == 'win-x64' && secrets.SIGNING_CERT_PFX_BASE64 != '' }}
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osslsigncode
          umask 077
          echo "$SIGNING_CERT_PFX_BASE64" | base64 -d > signing-cert.pfx
          EXE="publish/win-x64/SalesforceCopilotConnector.exe"
          osslsigncode sign \
            -pkcs12 signing-cert.pfx -pass "$SIGNING_CERT_PASSWORD" \
            -n "Salesforce Copilot Connector" \
            -t http://timestamp.digicert.com \
            -in "$EXE" -out "$EXE.signed"
          mv "$EXE.signed" "$EXE"
          osslsigncode verify -in "$EXE" || true
          rm -f signing-cert.pfx

      - name: Authenticode signing skipped (no signing secrets)
        if: ${{ matrix.rid == 'win-x64' && secrets.SIGNING_CERT_PFX_BASE64 == '' }}
        run: echo "::notice::SIGNING_CERT_PFX_BASE64 not configured — shipping the win-x64 binary unsigned."

      # Bundle layout mirrors a checkout: the app resolves config/ (and env/)
      # relative to its working directory, so the zip extracts to a directory
      # you run it from.
      - name: Assemble bundle
        id: bundle
        run: |
          NAME="SalesforceCopilotConnector-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          ROOT="bundle/$NAME"
          mkdir -p "$ROOT/env" "$ROOT/scripts"
          find "publish/${{ matrix.rid }}" -maxdepth 1 -type f \
            ! -name "*.pdb" -exec cp {} "$ROOT/" \;
          cp -r config "$ROOT/config"
          cp env/.env.local.example "$ROOT/env/"
          cp env/README.md "$ROOT/env/"
          cp -r docs "$ROOT/docs"
          cp -r scripts/sql "$ROOT/scripts/sql"
          cp README.md LICENSE NOTICE "$ROOT/"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            cp scripts/install-windows-service.ps1 "$ROOT/scripts/"
          fi
          (cd bundle && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Prove the artifact is actually runnable — a single-file self-contained
      # publish can build fine and still fail to bootstrap (missing native
      # libs). --help exercises startup + the ported argparse without needing
      # credentials.
      - name: Smoke test published binary
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          cd "bundle/${{ steps.bundle.outputs.name }}"
          chmod +x SalesforceCopilotConnector
          ./SalesforceCopilotConnector --help

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.rid }}
          path: bundle/*.zip*
          if-no-files-found: error

  # Container distribution: the same image the docker CI job validates, pushed
  # to GHCR on tag builds. Dispatch dry runs build it end to end but never push.
  container:
    name: Container image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: img
        run: |
          # Registry paths must be lowercase; the repo owner is not.
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/salesforce-copilot-connector" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (push on tag builds only)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cosign image signing — GATED on the cosign key secrets existing; skipped
      # with a notice otherwise. Signs by digest (not tag) so the signature
      # covers exactly the pushed image. Secrets: SIGNING_COSIGN_PRIVATE_KEY
      # (cosign.key contents), SIGNING_COSIGN_PASSWORD.
      - name: Install cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_COSIGN_PASSWORD }}
        run: |
          IMAGE="$(echo "${{ steps.img.outputs.tags }}" | cut -d',' -f1 | cut -d':' -f1)"
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: cosign signing skipped (no cosign secrets)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_COSIGN_PRIVATE_KEY == '' }}
        run: echo "::notice::SIGNING_COSIGN_PRIVATE_KEY not configured — image pushed unsigned."

  # ---------------------------------------------------------------------------
  # MSI packaging (EXPERIMENTAL): WiX v5 build of packaging/msi/ on a Windows
  # runner — authored on a non-Windows dev box, so treat the artifact as
  # candidate-quality until it has been installed on a test server. Uploaded as
  # a run artifact only (not attached to the release) while experimental.
  # continue-on-error keeps a red MSI build from blocking the release train.
  # ---------------------------------------------------------------------------
  msi:
    name: MSI package (experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          # MSI ProductVersion must be numeric x.y.z — strip any prerelease tag.
          MSIVER="${VER%%-*}"
          if [[ "$MSIVER" == "0.0.0" ]]; then MSIVER="0.0.1"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "msiversion=$MSIVER" >> "$GITHUB_OUTPUT"

      - name: Publish win-x64 payload
        run: >-
          dotnet publish src/SalesforceCopilotConnector -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: bash
        run: |
          mkdir -p out
          wix build packaging/msi/SalesforceConnector.wxs \
            -arch x64 \
            -d PublishDir=publish/win-x64 \
            -d RepoRoot=. \
            -d ProductVersion=${{ steps.ver.outputs.msiversion }} \
            -o out/SalesforceCopilotConnector-${{ steps.ver.outputs.version }}-x64.msi

      - name: Validate MSI (smoke)
        shell: pwsh
        run: |
          $msi = Get-ChildItem out/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI not produced" }
          Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-experimental
          path: out/*.msi
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [package, sbom]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "SalesforceCopilotConnector $GITHUB_REF_NAME"
          --generate-notes
