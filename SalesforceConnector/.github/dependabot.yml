version: 2

updates:
  # ---- NuGet: connector -----------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/src/SalesforceCopilotConnector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- NuGet: test project --------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/tests/SalesforceCopilotConnector.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- NuGet: stress-harness tool -------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/tools/StressHarness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "nuget"

  # ---- GitHub Actions -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ---- Docker (base images in the Dockerfile) -------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
