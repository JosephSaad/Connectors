# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THIS WORKFLOW DOES NOT RUN.                                             │
# │                                                                         │
# │ GitHub Actions only executes workflows from /.github/workflows at the   │
# │ REPOSITORY ROOT. This file sits under a connector directory, left from  │
# │ when each connector was its own repository, so no tag push has ever     │
# │ triggered it and no release has ever been produced by it.               │
# │                                                                         │
# │ It is kept because it is the only design the fleet has for release      │
# │ engineering — CycloneDX SBOM, self-contained single-file publish,       │
# │ Authenticode and cosign signing, GitHub release creation — none of      │
# │ which the root workflows do. Delete it only once that pipeline has      │
# │ been ported to the root, not before.                                    │
# │                                                                         │
# │ The sibling ci.yml and codeql.yml were removed in the commit that added │
# │ this banner; their work IS covered at the root.                         │
# └─────────────────────────────────────────────────────────────────────────┘

name: Release

# Two entry points:
#   - tag push (v*): full pipeline, ends by creating a GitHub release with the
#     bundles (and their sha256 checksums) attached.
#   - workflow_dispatch: dry run — identical build/smoke/package path, bundles
#     upload as run artifacts only, and NO release is created. Use this to
#     validate the pipeline without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed by the release job to create the GitHub release on tag builds.
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Releases gate on the full suite — a tag on a red commit must not ship.
  test:
    name: Full test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test -c Release

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # win-x64 first-class: Windows Server + service mode is the primary
        # deployment target. linux-x64 covers containers/VMs.
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/SeismicConnector -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # SBOM: one CycloneDX bill of materials per bundle, generated from the
      # solution's resolved package graph. Ships inside the bundle AND as a
      # standalone release asset so scanners can pull it without unzipping.
      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX SeismicConnector.sln -o sbom -j \
            -sv "${{ steps.ver.outputs.version }}"
          mv sbom/bom.json "sbom/SeismicConnector-${{ steps.ver.outputs.version }}-sbom.cyclonedx.json"

      # Authenticode: sign the Windows executable when signing secrets are
      # configured; otherwise skip GRACEFULLY (unsigned exe ships, with a
      # visible notice). Secrets: AUTHENTICODE_PFX_BASE64 (base64 PFX) and
      # AUTHENTICODE_PFX_PASSWORD.
      - name: Authenticode sign win-x64 exe (gated on secrets)
        if: ${{ matrix.rid == 'win-x64' }}
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if [ -z "$AUTHENTICODE_PFX_BASE64" ]; then
            echo "::notice::AUTHENTICODE_PFX_BASE64 not configured — skipping Authenticode signing."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          echo "$AUTHENTICODE_PFX_BASE64" | base64 -d > signing.pfx
          EXE="publish/win-x64/SeismicConnector.exe"
          osslsigncode sign -pkcs12 signing.pfx -pass "$AUTHENTICODE_PFX_PASSWORD" \
            -n "Seismic Copilot Connector" -i "https://github.com/${GITHUB_REPOSITORY}" \
            -t http://timestamp.digicert.com \
            -in "$EXE" -out "$EXE.signed"
          mv "$EXE.signed" "$EXE"
          rm -f signing.pfx
          echo "Authenticode signature applied."

      # Bundle layout mirrors a checkout: the app resolves config/ (and env/)
      # relative to its working directory, so the zip extracts to a directory
      # you run it from.
      - name: Assemble bundle
        id: bundle
        run: |
          NAME="SeismicConnector-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          ROOT="bundle/$NAME"
          mkdir -p "$ROOT/env" "$ROOT/scripts"
          find "publish/${{ matrix.rid }}" -maxdepth 1 -type f \
            ! -name "*.pdb" -exec cp {} "$ROOT/" \;
          cp -r config "$ROOT/config"
          cp env/.env.local.example "$ROOT/env/"
          cp env/README.md "$ROOT/env/"
          cp -r docs "$ROOT/docs"
          cp -r scripts/sql "$ROOT/scripts/sql"
          cp README.md LICENSE NOTICE SECURITY.md CHANGELOG.md "$ROOT/"
          cp sbom/SeismicConnector-*-sbom.cyclonedx.json "$ROOT/"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            cp scripts/install-windows-service.ps1 "$ROOT/scripts/"
          fi
          (cd bundle && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          cp sbom/SeismicConnector-*-sbom.cyclonedx.json bundle/
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # cosign: detached signature over the bundle zip when a cosign key pair
      # is configured; otherwise skip GRACEFULLY. Secrets: COSIGN_PRIVATE_KEY
      # (cosign.key contents) and COSIGN_PASSWORD.
      - name: Check cosign secrets
        id: cosign-check
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COSIGN_PRIVATE_KEY not configured — skipping cosign signatures."
          fi

      - name: Install cosign
        if: ${{ steps.cosign-check.outputs.enabled == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign bundle (gated on secrets)
        if: ${{ steps.cosign-check.outputs.enabled == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for f in bundle/*.zip; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "$f.sig" "$f"
          done

      # Prove the artifact is actually runnable — a single-file self-contained
      # publish can build fine and still fail to bootstrap (missing native
      # libs). --help exercises startup + the CLI parser without credentials.
      - name: Smoke test published binary
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          cd "bundle/${{ steps.bundle.outputs.name }}"
          chmod +x SeismicConnector
          ./SeismicConnector --help

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: |
            bundle/*.zip*
            bundle/*.cyclonedx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # MSI package (EXPERIMENTAL): WiX v5 build of packaging/msi/ on a Windows
  # runner. Installs the exe + config templates under Program Files and
  # registers the Windows service (not started — configuration comes first).
  # Uploaded as a run artifact only; the zip bundles remain the supported
  # distribution until the MSI graduates. continue-on-error keeps an MSI
  # toolchain hiccup from blocking a release.
  # ---------------------------------------------------------------------------
  msi:
    name: MSI package (win-x64, experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (win-x64 single file)
        run: >-
          dotnet publish src/SeismicConnector -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Build MSI (WiX v5)
        shell: bash
        run: |
          dotnet tool install --global wix --version "5.*"
          wix build packaging/msi/SeismicConnector.wxs \
            -arch x64 \
            -d PublishDir=publish/win-x64 \
            -d RepoRoot=. \
            -d ProductVersion=${{ steps.ver.outputs.version }} \
            -o "SeismicConnector-${{ steps.ver.outputs.version }}-win-x64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-win-x64-experimental
          path: SeismicConnector-*.msi
          if-no-files-found: error

  # Container distribution: the same image the docker CI job validates, pushed
  # to GHCR on tag builds. Dispatch dry runs build it end to end but never push.
  container:
    name: Container image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: img
        run: |
          # Registry paths must be lowercase; the repo owner is not.
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/seismic-connector" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (push on tag builds only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "SeismicConnector $GITHUB_REF_NAME"
          --generate-notes
