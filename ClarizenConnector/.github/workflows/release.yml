# ┌─────────────────────────────────────────────────────────────────────────┐
# │ THIS WORKFLOW DOES NOT RUN.                                             │
# │                                                                         │
# │ GitHub Actions only executes workflows from /.github/workflows at the   │
# │ REPOSITORY ROOT. This file sits under a connector directory, left from  │
# │ when each connector was its own repository, so no tag push has ever     │
# │ triggered it and no release has ever been produced by it.               │
# │                                                                         │
# │ It is kept because it is the only design the fleet has for release      │
# │ engineering — CycloneDX SBOM, self-contained single-file publish,       │
# │ Authenticode and cosign signing, GitHub release creation — none of      │
# │ which the root workflows do. Delete it only once that pipeline has      │
# │ been ported to the root, not before.                                    │
# │                                                                         │
# │ The sibling ci.yml and codeql.yml were removed in the commit that added │
# │ this banner; their work IS covered at the root.                         │
# └─────────────────────────────────────────────────────────────────────────┘

name: Release

# Two entry points:
#   - tag push (v*): full pipeline, ends by creating a GitHub release with the
#     bundles attached.
#   - workflow_dispatch: dry run — identical build/smoke/package path, bundles
#     upload as run artifacts only, and NO release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed by the release job to create the GitHub release on tag builds.
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Releases gate on the full suite — a tag on a red commit must not ship.
  test:
    name: Full test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test -c Release

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # win-x64 first-class: Windows Server + service mode is the primary
        # deployment target. linux-x64 covers containers/VMs.
        rid: [win-x64, linux-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/ClarizenConnector -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Bundle layout mirrors a checkout: the app resolves config/ (and env/)
      # relative to its working directory, so the zip extracts to a directory
      # you run it from.
      - name: Assemble bundle
        id: bundle
        run: |
          NAME="ClarizenConnector-${{ steps.ver.outputs.version }}-${{ matrix.rid }}"
          ROOT="bundle/$NAME"
          mkdir -p "$ROOT/env" "$ROOT/scripts"
          find "publish/${{ matrix.rid }}" -maxdepth 1 -type f \
            ! -name "*.pdb" -exec cp {} "$ROOT/" \;
          cp -r config "$ROOT/config"
          cp env/.env.local.example "$ROOT/env/"
          cp -r docs "$ROOT/docs"
          cp -r scripts/sql "$ROOT/scripts/sql"
          cp README.md LICENSE NOTICE "$ROOT/"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            cp scripts/install-windows-service.ps1 "$ROOT/scripts/"
          fi
          (cd bundle && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Prove the artifact is actually runnable — a single-file self-contained
      # publish can build fine and still fail to bootstrap (missing native
      # libs). --help exercises startup + the CLI parser without credentials.
      - name: Smoke test published binary
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          cd "bundle/${{ steps.bundle.outputs.name }}"
          chmod +x ClarizenConnector
          ./ClarizenConnector --help

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.rid }}
          path: bundle/*.zip*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Software bill of materials (CycloneDX) for the whole solution — attached to
  # the GitHub release so consumers can audit the dependency tree per version.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX ClarizenConnector.sln -o sbom --json --filename ClarizenConnector.sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/ClarizenConnector.sbom.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # EXPERIMENTAL: WiX v5 MSI (packaging/msi/) on a windows runner — WiX cannot
  # run on the linux/macOS runners, and the zip bundle remains the canonical
  # install path. Authenticode signing is gated on repository secrets
  # (WINDOWS_CODESIGN_PFX base64 + WINDOWS_CODESIGN_PASSWORD) and skips
  # gracefully when they are absent.
  # ---------------------------------------------------------------------------
  msi:
    name: MSI package (windows, experimental)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    env:
      HAVE_AUTHENTICODE: ${{ secrets.WINDOWS_CODESIGN_PFX != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate WiX XML well-formedness
        shell: bash
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('packaging/msi/ClarizenConnector.wxs'); print('well-formed')"

      - name: Publish (self-contained single file, win-x64)
        shell: bash
        run: >-
          dotnet publish src/ClarizenConnector -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Authenticode-sign the executable
        if: ${{ env.HAVE_AUTHENTICODE == 'true' }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CODESIGN_PFX }}"))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p "${{ secrets.WINDOWS_CODESIGN_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish/win-x64/ClarizenConnector.exe
          Remove-Item $pfx

      - name: Authenticode signing skipped (no secrets)
        if: ${{ env.HAVE_AUTHENTICODE != 'true' }}
        shell: bash
        run: echo "WINDOWS_CODESIGN_PFX not configured — shipping the MSI unsigned (expected on forks/dry runs)."

      - name: Build MSI (WiX v5)
        shell: bash
        run: |
          dotnet tool install --global wix
          wix build packaging/msi/ClarizenConnector.wxs \
            -d PublishDir=publish/win-x64 -d ProjectRoot=. \
            -arch x64 -o out/ClarizenConnector.msi

      - name: Authenticode-sign the MSI
        if: ${{ env.HAVE_AUTHENTICODE == 'true' }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CODESIGN_PFX }}"))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p "${{ secrets.WINDOWS_CODESIGN_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/ClarizenConnector.msi
          Remove-Item $pfx

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi-experimental
          path: out/*.msi
          if-no-files-found: error

  # Container distribution: the same image the docker CI job validates, pushed
  # to GHCR on tag builds. Dispatch dry runs build it end to end but never push.
  container:
    name: Container image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: img
        run: |
          # Registry paths must be lowercase; the repo owner is not.
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/clarizen-connector" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:ci-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (push on tag builds only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: [package, sbom]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      HAVE_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist

      # The MSI job is experimental (continue-on-error) — a missing artifact
      # must not block the release.
      - name: Download MSI (experimental, optional)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: msi-experimental
          path: dist

      # cosign keyless would need OIDC id-token permissions; key-based signing
      # is gated on COSIGN_PRIVATE_KEY/COSIGN_PASSWORD secrets and skips
      # gracefully when they are absent.
      - name: Install cosign
        if: ${{ env.HAVE_COSIGN == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (cosign)
        if: ${{ env.HAVE_COSIGN == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for f in dist/*.zip dist/*.msi dist/*.json; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "$f.sig" "$f"
            echo "signed: $f"
          done

      - name: Cosign signing skipped (no secrets)
        if: ${{ env.HAVE_COSIGN != 'true' }}
        run: echo "COSIGN_PRIVATE_KEY not configured — release ships without cosign signatures (expected on forks)."

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "ClarizenConnector $GITHUB_REF_NAME"
          --generate-notes
