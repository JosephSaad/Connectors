name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Core build + unit tests (no external services; every HTTP call is mocked).
  # This is the gating job.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is not a nicety: Windows Server is the primary
        # deployment target (Windows service mode), so the suite must pass
        # there, not only on the linux CI/dev machines.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: >-
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results (trx)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload code coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Line-coverage floor. Measured 77.1% (5686/7373 lines) at the time the gate
  # was introduced; the enforced threshold is that minus a 5-point buffer so
  # ordinary churn never flakes the gate but a real coverage regression fails.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (line floor 72%)
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "72"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test with XPlat coverage collector
        run: >-
          dotnet test -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./CoverageResults

      - name: Enforce line-coverage threshold
        run: |
          REPORT="$(find ./CoverageResults -name 'coverage.cobertura.xml' | head -n 1)"
          if [[ -z "$REPORT" ]]; then
            echo "::error::No coverage.cobertura.xml produced."
            exit 1
          fi
          RATE="$(grep -o 'line-rate="[0-9.]*"' "$REPORT" | head -n 1 | grep -o '[0-9.]*')"
          PCT="$(awk -v r="$RATE" 'BEGIN { printf "%.2f", r * 100 }')"
          echo "Line coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v p="$PCT" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit (p+0 >= t+0) ? 0 : 1 }' \
            || { echo "::error::Line coverage ${PCT}% is below the ${COVERAGE_THRESHOLD}% floor."; exit 1; }

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: "**/CoverageResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Perf smoke: the round-1/round-2 stress harnesses (concurrency invariants,
  # sustained-load shapes) on their own generous wall-clock budget so a slow
  # shared runner cannot flake the gate — this job catches order-of-magnitude
  # regressions, not microbenchmark noise.
  # ---------------------------------------------------------------------------
  perf-smoke:
    name: Perf smoke (stress harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Selects the 9 *StressTests classes defined in StressHarness.cs +
      # StressHarnessRound2.cs (26 tests) — the filter matches CLASS names,
      # which all end in "StressTests"; the file names are not part of the FQN.
      - name: Run stress-test classes
        run: >-
          dotnet test -c Release
          --filter "FullyQualifiedName~StressTests"
          --logger "console;verbosity=normal"

  # ---------------------------------------------------------------------------
  # MSI authoring sanity: packaging/msi/*.wxs must stay well-formed XML on
  # every platform (the real `wix build` runs on the windows release runner —
  # WiX cannot run here). Cheap and catches the common editing mistake.
  # ---------------------------------------------------------------------------
  msi-xml:
    name: MSI WiX XML well-formedness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate .wxs well-formedness
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.dom.minidom
          files = glob.glob("packaging/msi/*.wxs")
          if not files:
              print("::error::No .wxs files found under packaging/msi/")
              sys.exit(1)
          for path in files:
              xml.dom.minidom.parse(path)
              print(f"{path}: well-formed")
          EOF

  # ---------------------------------------------------------------------------
  # Provision the SQL schema against a real SQL Server 2022 — twice, proving
  # the documented idempotent re-run/upgrade path against a live engine (the
  # static ScriptDom/DacFx suite covers grammar + binding offline).
  # ---------------------------------------------------------------------------
  sql-provisioning:
    name: SQL Schema Provisioning (idempotent re-run)
    runs-on: ubuntu-latest
    env:
      # Workflow-local throwaway SA password; only exists for this job's
      # service container. No repo secret needed.
      SA_PASSWORD: "Your_strong!Passw0rd1"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_strong!Passw0rd1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for SQL Server to accept connections
        run: |
          echo "Waiting for SQL Server on 127.0.0.1:1433 ..."
          for i in $(seq 1 40); do
            if docker run --rm --network host \
                 mcr.microsoft.com/mssql-tools:latest \
                 /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up (attempt $i)."
              exit 0
            fi
            echo "  not ready yet (attempt $i/40); sleeping 5s"
            sleep 5
          done
          echo "::error::SQL Server did not become ready in time."
          exit 1

      - name: Provision database schema (twice)
        run: |
          for pass in 1 2; do
            echo "Running scripts/sql/create-database.sql via sqlcmd (pass $pass) ..."
            docker run --rm --network host \
              -v "${{ github.workspace }}/scripts/sql:/scripts:ro" \
              mcr.microsoft.com/mssql-tools:latest \
              /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P "$SA_PASSWORD" -b -i /scripts/create-database.sql
          done

  # ---------------------------------------------------------------------------
  # Build the container image (no push) to validate the Dockerfile builds end
  # to end. Load into the local daemon so a runtime-stage failure is caught too.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: clarizen-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
